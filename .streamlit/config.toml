# Disable file watcher to suppress noisy torchvision warnings during startup.
# Streamlit's local_sources_watcher scans all installed modules (including
# transformers' image_processing_*) which raises ModuleNotFoundError for
# torchvision — harmless noise since this project uses text embeddings only.
# Trade-off: editing app.py won't trigger auto-reload. Restart manually.
[server]
fileWatcherType = "none"
